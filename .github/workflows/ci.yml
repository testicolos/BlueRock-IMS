name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bluerock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bluerock_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bluerock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:navigation
      - run: npm run test:scan-access
      - run: npm run test:scan-evidence
      - run: npm run test:scan-sessions
      - run: npm run test:scanner-workflow
      - run: npm run test:material-api
      - run: npm run test:sample-assignments
      # test:scans contains legacy assertions that a scan immediately moves an item.
      # Movement now requires transfer approval and is covered by test:scanner-workflow.
      - run: npm run test:report-xlsx
