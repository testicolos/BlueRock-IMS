name: CI

on:
  pull_request:
  push:
    branches:
      - feature/scanner-location-transfers

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:scan-access
      - run: npm run test:scan-evidence
      - run: npm run test:navigation
      - run: npm run test:scan-sessions
